<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Registrar negocio | YaVoy</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f5f7fb;
      font-family: "DM Sans", system-ui, sans-serif;
      color: #172033;
    }

    .card {
      width: min(100%, 560px);
      background: #fff;
      border: 1px solid #e1e6ef;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 16px 40px rgba(25, 42, 70, 0.08);
    }

    h1 { margin: 0 0 8px; }
    .intro { margin: 0 0 22px; color: #667085; line-height: 1.5; }

    form {
      display: grid;
      gap: 16px;
    }

    label {
      display: grid;
      gap: 7px;
      font-weight: 700;
    }

    input, select, textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      border: 1px solid #cfd6e3;
      border-radius: 12px;
      font: inherit;
    }

    textarea { min-height: 90px; resize: vertical; }

    button {
      border: 0;
      border-radius: 12px;
      padding: 14px 18px;
      background: #3157d5;
      color: white;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled { opacity: .65; cursor: wait; }

    #sessionState,
    #result {
      margin-bottom: 18px;
      padding: 12px 14px;
      border-radius: 12px;
      white-space: pre-wrap;
      line-height: 1.5;
    }

    #sessionState { background: #eef3ff; color: #2744a0; }
    #result { display: none; margin-top: 18px; margin-bottom: 0; }
    #result.visible { display: block; }
    #result.success { background: #ecfdf3; color: #146c43; }
    #result.error { background: #fff1f0; color: #b42318; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Registra tu negocio</h1>
    <p class="intro">Esta prueba valida que un usuario autenticado puede crear su propio negocio en Supabase.</p>

    <div id="sessionState">Validando sesión...</div>

    <form id="businessForm" hidden>
      <label>
        Nombre del negocio
        <input id="name" required maxlength="120" />
      </label>

      <label>
        Categoría
        <select id="category" required>
          <option value="">Selecciona una categoría</option>
          <option value="comida">Comida</option>
          <option value="hogar">Hogar</option>
          <option value="belleza">Belleza</option>
          <option value="moda">Moda</option>
          <option value="servicios">Servicios</option>
          <option value="tecnologia">Tecnología</option>
        </select>
      </label>

      <label>
        Ciudad
        <select id="city" required>
          <option value="la-dorada">La Dorada</option>
          <option value="puerto-salgar">Puerto Salgar</option>
        </select>
      </label>

      <label>
        Descripción
        <textarea id="description" maxlength="500" placeholder="Describe brevemente tu negocio"></textarea>
      </label>

      <button id="saveButton" type="submit">Guardar negocio</button>
    </form>

    <div id="result" role="status" aria-live="polite"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script>
    const sessionState = document.getElementById("sessionState");
    const form = document.getElementById("businessForm");
    const saveButton = document.getElementById("saveButton");
    const result = document.getElementById("result");

    let currentUser = null;

    function showResult(message, type) {
      result.textContent = message;
      result.className = `visible ${type}`;
    }

    async function init() {
      if (!window.yavoyDb) {
        sessionState.textContent = "ERROR: Supabase no está configurado.";
        return;
      }

      const { data, error } = await window.yavoyDb.auth.getUser();

      if (error || !data.user) {
        sessionState.textContent = "NO HAY SESIÓN ACTIVA\n\nInicia sesión primero en login.html.";
        return;
      }

      currentUser = data.user;
      sessionState.textContent = `SESIÓN ACTIVA\n\n${currentUser.email}`;
      form.hidden = false;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!currentUser) {
        showResult("ERROR\n\nNo hay usuario autenticado.", "error");
        return;
      }

      saveButton.disabled = true;
      saveButton.textContent = "Guardando...";
      result.className = "";

      const payload = {
        owner_id: currentUser.id,
        name: document.getElementById("name").value.trim(),
        category: document.getElementById("category").value,
        city: document.getElementById("city").value,
        description: document.getElementById("description").value.trim() || null,
        status: "draft"
      };

      const { data, error } = await window.yavoyDb
        .from("businesses")
        .insert(payload)
        .select("id, name, category, city, status")
        .single();

      saveButton.disabled = false;
      saveButton.textContent = "Guardar negocio";

      if (error) {
        console.error("Error guardando negocio", error);
        showResult(`ERROR\n\n${error.message}`, "error");
        return;
      }

      showResult(
        `NEGOCIO CREADO OK\n\nNombre: ${data.name}\nCategoría: ${data.category}\nCiudad: ${data.city}\nEstado: ${data.status}`,
        "success"
      );
    });

    init();
  </script>
</body>
</html>
