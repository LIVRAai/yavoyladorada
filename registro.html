<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Registro de negocio | YaVoy</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f5f7fb;
      font-family: "DM Sans", system-ui, sans-serif;
      color: #172033;
    }

    .signup-card {
      width: min(100%, 460px);
      background: #fff;
      border: 1px solid #e1e6ef;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 16px 40px rgba(25, 42, 70, 0.08);
    }

    .signup-card h1 {
      margin: 0 0 8px;
      font-size: 2rem;
    }

    .signup-card > p {
      margin: 0 0 24px;
      color: #667085;
      line-height: 1.5;
    }

    .signup-form {
      display: grid;
      gap: 16px;
    }

    .signup-form label {
      display: grid;
      gap: 7px;
      font-weight: 700;
    }

    .signup-form input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px 14px;
      border: 1px solid #cfd6e3;
      border-radius: 12px;
      font: inherit;
    }

    .signup-form button {
      border: 0;
      border-radius: 12px;
      padding: 14px 18px;
      background: #3157d5;
      color: #fff;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    .signup-form button:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    .signup-result {
      display: none;
      margin-top: 18px;
      padding: 14px;
      border-radius: 12px;
      white-space: pre-wrap;
      line-height: 1.5;
    }

    .signup-result.is-visible {
      display: block;
    }

    .signup-result.success {
      background: #ecfdf3;
      color: #146c43;
    }

    .signup-result.error {
      background: #fff1f0;
      color: #b42318;
    }
  </style>
</head>
<body>
  <main class="signup-card">
    <h1>Crea tu cuenta</h1>
    <p>Esta prueba valida únicamente la creación de una cuenta de comercio en YaVoy.</p>

    <form id="signupForm" class="signup-form">
      <label>
        Correo electrónico
        <input id="email" type="email" autocomplete="email" required />
      </label>

      <label>
        Contraseña
        <input id="password" type="password" autocomplete="new-password" minlength="6" required />
      </label>

      <button id="signupButton" type="submit">Crear cuenta</button>
    </form>

    <div id="signupResult" class="signup-result" role="status" aria-live="polite"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script>
    const form = document.getElementById("signupForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const button = document.getElementById("signupButton");
    const result = document.getElementById("signupResult");

    function showResult(message, type) {
      result.textContent = message;
      result.className = `signup-result is-visible ${type}`;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!window.yavoyDb) {
        showResult("ERROR\n\nSupabase no está configurado.", "error");
        return;
      }

      button.disabled = true;
      button.textContent = "Creando cuenta...";
      result.className = "signup-result";

      const { data, error } = await window.yavoyDb.auth.signUp({
        email: emailInput.value.trim(),
        password: passwordInput.value
      });

      button.disabled = false;
      button.textContent = "Crear cuenta";

      if (error) {
        console.error("Error creando cuenta", error);
        showResult(`ERROR\n\n${error.message}`, "error");
        return;
      }

      if (!data.user) {
        showResult("ERROR\n\nSupabase no devolvió un usuario creado.", "error");
        return;
      }

      if (data.session) {
        showResult(
          "CUENTA CREADA OK\n\nSesión iniciada correctamente.",
          "success"
        );
        return;
      }

      showResult(
        "CUENTA CREADA OK\n\nSupabase requiere confirmar el correo antes de iniciar sesión.",
        "success"
      );
    });
  </script>
</body>
</html>
