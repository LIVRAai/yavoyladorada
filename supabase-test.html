<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prueba Supabase | YaVoy</title>
</head>
<body>
  <main>
    <h1>Prueba de conexión YaVoy → Supabase</h1>
    <pre id="resultado">Probando conexión...</pre>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script>
    const resultado = document.getElementById("resultado");

    async function probarConexion() {
      if (!window.YAVOY_SUPABASE_CONFIGURED || !window.yavoyDb) {
        resultado.textContent = [
          "CONFIGURACIÓN PENDIENTE",
          "",
          "Completa YAVOY_SUPABASE_URL y YAVOY_SUPABASE_PUBLISHABLE_KEY",
          "en supabase-client.js."
        ].join("\n");
        return;
      }

      const { data, error } = await window.yavoyDb
        .from("businesses")
        .select("id, name, status");

      if (error) {
        console.error(error);
        resultado.textContent = `ERROR\n\n${error.message}`;
        return;
      }

      console.log("Conexión Supabase OK", data);
      resultado.textContent = [
        "CONEXIÓN SUPABASE OK",
        "",
        `Negocios visibles: ${data.length}`
      ].join("\n");
    }

    probarConexion();
  </script>
</body>
</html>
