<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#1F6B45" />
  <title>Nueva contraseña | Local 💚</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="negocios.css" />
  <script src="/analytics.js"></script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <header class="business-header">
    <div class="business-shell business-header-inner">
      <a class="brand" href="index.html">Local <span class="brand-heart" aria-hidden="true">💚</span></a>
      <div class="header-actions">
        <a class="button ghost" href="login.html">Volver al inicio de sesión</a>
      </div>
    </div>
  </header>

  <main class="business-main">
    <div class="narrow">
      <section class="card">
        <div class="auth-intro">
          <span class="eyebrow">Recuperación de cuenta</span>
          <h1>Crea una nueva contraseña.</h1>
          <p class="lead">Elige una contraseña nueva para volver a entrar a tu espacio Local 💚.</p>
        </div>

        <div id="status" class="notice info">Validando tu enlace de recuperación...</div>

        <form id="resetForm" class="form-grid" hidden>
          <label class="field full">Nueva contraseña
            <input id="newPassword" type="password" autocomplete="new-password" minlength="6" required />
            <small>Mínimo 6 caracteres.</small>
          </label>
          <label class="field full">Confirmar nueva contraseña
            <input id="confirmPassword" type="password" autocomplete="new-password" minlength="6" required />
          </label>
          <div class="form-actions">
            <button id="resetButton" class="button primary" type="submit">Actualizar contraseña</button>
          </div>
        </form>

        <div id="expiredActions" class="form-actions" hidden>
          <a class="button primary" href="login.html?recovery=1">Solicitar un nuevo enlace</a>
          <a class="button ghost" href="login.html">Volver al inicio de sesión</a>
        </div>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script>
    const form = document.getElementById("resetForm");
    const newPasswordInput = document.getElementById("newPassword");
    const confirmPasswordInput = document.getElementById("confirmPassword");
    const resetButton = document.getElementById("resetButton");
    const status = document.getElementById("status");
    const expiredActions = document.getElementById("expiredActions");

    let recoveryReady = false;

    function showStatus(message, type = "info") {
      status.textContent = message;
      status.className = `notice ${type}`;
      status.hidden = false;
    }

    function markReady() {
      if (recoveryReady) return;
      recoveryReady = true;
      form.hidden = false;
      expiredActions.hidden = true;
      showStatus("Enlace validado. Ya puedes crear tu nueva contraseña.", "success");

      if (window.location.hash) {
        window.history.replaceState(null, document.title, window.location.pathname);
      }

      newPasswordInput.focus();
    }

    function markExpired() {
      if (recoveryReady) return;
      form.hidden = true;
      expiredActions.hidden = false;
      showStatus("Este enlace no es válido o ya venció. Solicita uno nuevo desde el inicio de sesión.", "error");
    }

    async function validateRecoverySession() {
      if (!window.yavoyDb) {
        showStatus("No pudimos conectar con Local en este momento.", "error");
        expiredActions.hidden = false;
        return;
      }

      const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ""));
      if (hashParams.get("error")) {
        markExpired();
        return;
      }

      const { data, error } = await window.yavoyDb.auth.getSession();
      if (!error && data.session) {
        markReady();
        return;
      }

      window.setTimeout(async () => {
        if (recoveryReady) return;
        const retry = await window.yavoyDb.auth.getSession();
        if (retry.data.session) markReady();
        else markExpired();
      }, 800);
    }

    window.yavoyDb?.auth.onAuthStateChange((event, session) => {
      if ((event === "PASSWORD_RECOVERY" || event === "SIGNED_IN") && session) {
        markReady();
      }
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const password = newPasswordInput.value;
      const confirmation = confirmPasswordInput.value;

      if (password.length < 6) {
        showStatus("La contraseña debe tener al menos 6 caracteres.", "error");
        return;
      }

      if (password !== confirmation) {
        showStatus("Las contraseñas no coinciden.", "error");
        return;
      }

      resetButton.disabled = true;
      resetButton.textContent = "Actualizando...";

      const { error } = await window.yavoyDb.auth.updateUser({
        password
      });

      if (error) {
        console.error(error);
        resetButton.disabled = false;
        resetButton.textContent = "Actualizar contraseña";
        showStatus("No pudimos actualizar la contraseña. Solicita un nuevo enlace e inténtalo otra vez.", "error");
        return;
      }

      await window.yavoyDb.auth.signOut();
      form.hidden = true;
      expiredActions.hidden = false;
      expiredActions.innerHTML = '<a class="button primary" href="login.html">Iniciar sesión con mi nueva contraseña</a>';
      showStatus("Tu contraseña fue actualizada correctamente.", "success");
    });

    validateRecoverySession();
  </script>
</body>
</html>
