<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#1F6B45" />
  <title>Mi espacio | Local 💚</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="negocios.css" />
</head>
<body>
  <header class="business-header">
    <div class="business-shell business-header-inner">
      <a class="brand" href="index.html">Local <span class="brand-heart" aria-hidden="true">💚</span></a>
      <div class="header-actions">
        <a class="button ghost hide-mobile" href="catalogo.html">Explorar comunidad</a>
        <a class="button primary" href="registro.html">Quiero ser parte</a>
      </div>
    </div>
  </header>

  <main class="business-main">
    <div class="narrow">
      <section class="card">
        <div class="auth-intro">
          <span class="eyebrow">Mi espacio Local</span>
          <h1>Qué bueno verte de nuevo.</h1>
          <p class="lead">Entra para administrar tu perfil, revisar tu membresía y ver el estado de publicación de tu emprendimiento.</p>
        </div>

        <form id="loginForm" class="form-grid">
          <label class="field full">Correo electrónico
            <input id="email" type="email" autocomplete="email" required />
          </label>
          <label class="field full">Contraseña
            <input id="password" type="password" autocomplete="current-password" required />
          </label>
          <div class="form-actions">
            <button id="loginButton" class="button primary" type="submit">Entrar a mi espacio</button>
          </div>
        </form>
        <div id="result" class="notice info" hidden></div>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script>
    const form = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const button = document.getElementById("loginButton");
    const result = document.getElementById("result");

    const requestedNext = new URLSearchParams(window.location.search).get("next");
    const safeTargets = new Set(["negocio.html", "mi-negocio.html", "retorno-pago.html"]);
    const nextPage = safeTargets.has(requestedNext) ? requestedNext : "mi-negocio.html";

    function show(message, type = "info") {
      result.textContent = message;
      result.className = `notice ${type}`;
      result.hidden = false;
    }

    async function redirectIfAuthenticated() {
      if (!window.yavoyDb) return;
      const { data } = await window.yavoyDb.auth.getSession();
      if (data.session) window.location.replace(nextPage);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!window.yavoyDb) {
        show("No pudimos conectar con Local en este momento.", "error");
        return;
      }

      button.disabled = true;
      button.textContent = "Entrando...";
      result.hidden = true;

      const { data, error } = await window.yavoyDb.auth.signInWithPassword({
        email: emailInput.value.trim(),
        password: passwordInput.value
      });

      button.disabled = false;
      button.textContent = "Entrar a mi espacio";

      if (error) {
        console.error(error);
        show(error.message, "error");
        return;
      }
      if (!data.session) {
        show("No pudimos iniciar una sesión válida.", "error");
        return;
      }

      window.location.assign(nextPage);
    });

    redirectIfAuthenticated();
  </script>
</body>
</html>
