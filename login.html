<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Iniciar sesión | YaVoy</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f5f7fb;
      font-family: "DM Sans", system-ui, sans-serif;
      color: #172033;
    }

    .login-card {
      width: min(100%, 460px);
      background: #fff;
      border: 1px solid #e1e6ef;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 16px 40px rgba(25, 42, 70, 0.08);
    }

    .login-card h1 {
      margin: 0 0 8px;
      font-size: 2rem;
    }

    .login-card > p {
      margin: 0 0 24px;
      color: #667085;
      line-height: 1.5;
    }

    .login-form {
      display: grid;
      gap: 16px;
    }

    .login-form label {
      display: grid;
      gap: 7px;
      font-weight: 700;
    }

    .login-form input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px 14px;
      border: 1px solid #cfd6e3;
      border-radius: 12px;
      font: inherit;
    }

    .login-form button {
      border: 0;
      border-radius: 12px;
      padding: 14px 18px;
      background: #3157d5;
      color: #fff;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    .login-form button:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    .login-result {
      display: none;
      margin-top: 18px;
      padding: 14px;
      border-radius: 12px;
      white-space: pre-wrap;
      line-height: 1.5;
    }

    .login-result.is-visible {
      display: block;
    }

    .login-result.success {
      background: #ecfdf3;
      color: #146c43;
    }

    .login-result.error {
      background: #fff1f0;
      color: #b42318;
    }
  </style>
</head>
<body>
  <main class="login-card">
    <h1>Inicia sesión</h1>
    <p>Esta prueba valida que una cuenta confirmada puede autenticarse en YaVoy.</p>

    <form id="loginForm" class="login-form">
      <label>
        Correo electrónico
        <input id="email" type="email" autocomplete="email" required />
      </label>

      <label>
        Contraseña
        <input id="password" type="password" autocomplete="current-password" required />
      </label>

      <button id="loginButton" type="submit">Iniciar sesión</button>
    </form>

    <div id="loginResult" class="login-result" role="status" aria-live="polite"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script>
    const form = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const button = document.getElementById("loginButton");
    const result = document.getElementById("loginResult");

    function showResult(message, type) {
      result.textContent = message;
      result.className = `login-result is-visible ${type}`;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!window.yavoyDb) {
        showResult("ERROR\n\nSupabase no está configurado.", "error");
        return;
      }

      button.disabled = true;
      button.textContent = "Iniciando sesión...";
      result.className = "login-result";

      const { data, error } = await window.yavoyDb.auth.signInWithPassword({
        email: emailInput.value.trim(),
        password: passwordInput.value
      });

      button.disabled = false;
      button.textContent = "Iniciar sesión";

      if (error) {
        console.error("Error iniciando sesión", error);
        showResult(`ERROR\n\n${error.message}`, "error");
        return;
      }

      if (!data.session || !data.user) {
        showResult("ERROR\n\nSupabase no devolvió una sesión válida.", "error");
        return;
      }

      showResult(
        `SESIÓN INICIADA OK\n\nUsuario autenticado: ${data.user.email}`,
        "success"
      );
    });
  </script>
</body>
</html>
